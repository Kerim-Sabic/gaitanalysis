[project]
name = "horalix-gait-api"
version = "0.1.0"
description = "Horalix Gait AI — markerless AI gait-analysis backend"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
