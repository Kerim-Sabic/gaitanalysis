services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      HORALIX_POSE_BACKEND: auto
      HORALIX_ALLOW_DEMO_MODE: "true"
      HORALIX_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./data:/app/../data
    restart: unless-stopped

  web:
    build:
      # Repo root context so the @horalix/shared file: dependency resolves.
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
