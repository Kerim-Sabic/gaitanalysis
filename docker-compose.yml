services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      HORALIX_POSE_BACKEND: auto_best
      HORALIX_ALLOW_DEMO_MODE: "true"
      HORALIX_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./data:/app/../data
    restart: unless-stopped

  # Real-inference backend (MediaPipe Tasks). Opt-in:
  #   docker compose --profile real up --build api-real
  api-real:
    profiles: ["real"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.real
    ports:
      - "8000:8000"
    environment:
      HORALIX_POSE_BACKEND: auto_best
      HORALIX_MEDIAPIPE_MODEL_PATH: /models/pose/mediapipe/pose_landmarker_full.task
      HORALIX_ALLOW_DEMO_MODE: "true"
      HORALIX_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./data:/data
      - ./models:/models:ro
    restart: unless-stopped

  api-mmpose:
    profiles: ["mmpose"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.mmpose
    volumes:
      - ./data:/repo/data:ro
      - ./models:/repo/models:ro
    restart: "no"

  # SAM2 segmentation helper profile (optional):
  #   docker compose --profile sam2 up --build api-sam2
  api-sam2:
    profiles: ["sam2"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.sam2
    volumes:
      - ./data:/repo/data:ro
      - ./models:/repo/models:ro
    restart: "no"

  # Depth Anything V2 relative-depth verification profile (optional):
  #   docker compose --profile depth up --build api-depth
  api-depth:
    profiles: ["depth"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.depth
    volumes:
      - ./data:/repo/data:ro
      - ./models:/repo/models:ro
    restart: "no"

  api-vision:
    profiles: ["vision"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.vision
    volumes:
      - ./data:/repo/data:ro
      - ./models:/repo/models:ro
    restart: "no"

  web:
    build:
      # Repo root context so the @horalix/shared file: dependency resolves.
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
